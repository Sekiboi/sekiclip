[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sekiclip"
version = "0.1.0b1"
description = "Offline media toolkit — convert, compress, trim. Free forever, no uploads."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Sekiboi" }]
keywords = ["video", "audio", "image", "ffmpeg", "offline", "freeware"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia",
]
dependencies = [
  "customtkinter>=5.2.0",
  "Pillow>=10.0.0",
  "tkinterdnd2>=0.3.0",
  "opencv-python-headless>=4.8.0",
  "numpy>=1.24.0",
  "sounddevice>=0.4.6",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
sekiclip = "sekiclip.cli:main"
sekiclip-gui = "sekiclip.app:main"

[project.urls]
Homepage = "https://github.com/Sekiboi/sekiclip"
Repository = "https://github.com/Sekiboi/sekiclip"
Issues = "https://github.com/Sekiboi/sekiclip/issues"

[tool.setuptools.packages.find]
include = ["sekiclip*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Avoid writing cache under protected or locked trees when possible
cache_dir = ".pytest_cache"
